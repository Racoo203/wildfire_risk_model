[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-susceptibility"
version = "0.2.0"
description = "Wildfire susceptibility mapping pipeline for Essex, UK — replication/extension of Bouzeraa et al. 2025"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22,<2.5",
    "pandas>=2.0,<3",
    "scikit-learn",
    "scikit-image",
    "scipy",
    "xarray",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "pydantic>=2.0",
    "affine",
    "cftime",
    "cligj",
    "geopandas",
    "h5netcdf",
    "netcdf4",
    "pyogrio",
    "pyproj",
    "rasterio",
    "shapely",
    "jenkspy",
    "statsmodels",
]

[project.optional-dependencies]
modeling = ["xgboost", "torch", "mlflow", "optuna", "shap", "imbalanced-learn"]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wildfire_susceptibility*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that hit mlflow/optuna/real model fits (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"