[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-susceptibility"
version = "0.3.0"
description = "Wildfire susceptibility mapping pipeline for Essex, UK — replication/extension of Bouzeraa et al. 2025"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "affine",
    "cftime",
    "cligj",
    "esda",
    "geopandas",
    "h5netcdf",
    "jenkspy",
    "libpysal",
    "matplotlib",
    "netcdf4",
    "numpy>=1.26",
    "pandas>=2.0,<3.0",
    "pydantic>=2.0",
    "pyogrio",
    "pyproj",
    "pyyaml",
    "rasterio",
    "scikit-learn",
    "scipy",
    "seaborn",
    "shapely",
    "statsmodels",
    "verde",
    "xarray",
]

[project.optional-dependencies]
modeling = [
    "catboost",
    "imbalanced-learn",
    "lightgbm",
    "mlflow",
    "mord",
    "optuna",
    "shap",
    "torch",
    "xgboost",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wildfire_susceptibility*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that hit mlflow/optuna/real model fits (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py313"