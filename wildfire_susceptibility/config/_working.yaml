base:
  region: "Essex"
  boundary_shapefile: "./data/silver/layers/boundary.shp"
  output_dir: "./data/silver/layers"
  model_data_dir: "./data/silver/model_datasets"
  figures_dir: "./figures"

processing:
  cell_size_m: 30.0
  crs: "EPSG:27700"
  training_years: [2009, 2022]
  test_years: [2022, 2026]
  force_recompute: true           # Kept as true for working/debug environment

seasons:
  active: ["spring", "summer", "fall"]
  seasonal_ndvi: true             # Aligns with schema default
  definitions:
    spring: [3, 4, 5]
    summer: [6, 7, 8]
    fall: [9, 10, 11]
    winter: [12, 1, 2]

data_sources:
  cua:
    data_dir: "./data/bronze/boundary"
  srtm:
    data_dir: "./data/bronze/topography"
    tiles:
      - "n51_e000_1arc_v3.tif"
      - "n51_e001_1arc_v3.tif"
      - "n51_w001_1arc_v3.tif"
      - "n52_e000_1arc_v3.tif"
      - "n52_e001_1arc_v3.tif"
  haduk:
    data_dir: "./data/bronze/climate_haduk"
    sources: ["tas", "tasmax", "tasmin", "rainfall", "sfcWind", "hurs"]
  modis_nvdi:
    data_dir: "./data/bronze/vegetation"
  proximity:
    data_dir: "./data/bronze/proximity"
    sources: ["oproad_gpkg_gb", "oprvrs_gpkg_gb", "essex-260607-free."]
    human_fclasses:
      - "residential"
      - "farmland"
      - "farm"
      - "farm_auxiliary"
      - "industrial"
      - "commercial"
      - "retail"
      - "allotmets"
      - "orchard"
      - "greenhouse_horticulture"
  incidents:
    data_dir: "./data/bronze/incidents"
    date_col: "CallDateID"
    geo_cols: ["IncidentEasting", "IncidentNorthing"]
    severity_cols: ["NumberVehiclesDeployed"]

labels:
  density_method: "convolution"
  conv_sigma_cells: 3
  kde_bandwidth_m: 500
  kde_zero_threshold: 1.0e-12
  include_d_fires_as_feature: false

  classify_method: "gmm"
  compare_classify_methods: ["percentile", "jenks", "gmm"]
  percentiles: [60, 75, 90]
  jenks_n_classes: 4
  jenks_max_sample: 200000
  gmm_n_components: 4
  gmm_max_sample: 200000
  gmm_random_state: 42

  kmeans_k: 2
  kmeans_n_init: 10
  kmeans_max_iter: 300
  max_sample_per_class: 200000
  random_state: 42

  clean_labels: true
  run_sensitivity: true
  sensitivity_n_inits: [10, 20]
  sensitivity_seeds: [7, 123]
  sensitivity_n_reweight_trials: 3
  sensitivity_feature_noise_std: 0.05
  
  # --- NEW: Added from defaults.yaml & schema.py ---
  clustering_exclude_features: ["tas", "tasmin", "landuse_class"]
  clustering_variance_floor_pct: 0.01

modeling:
  models: ["random_forest", "svm", "xgboost", "neural_net"]
  cv_folds: 5
  cv_strategy: "spatial"          # Retained working override (default is "both")
  spatial_block_size_m: 5000.0    # NEW: Added from schema.py
  mlflow_experiment: "wildfire-susceptibility-essex"
  selection_rule: "best_auc"
  
  optuna_n_trials: 30
  optuna_search_subsample: 100000 # Retained working override (default is 50000)
  optuna_search_subsample_by_model: # NEW: Added from schema.py
    svm: 6000
    
  # --- NEW: Added from defaults.yaml & schema.py ---
  excluded_features: ["tas", "tasmin"]

  # Retained custom SMOTE experimentation settings
  use_smote: true
  smote_k_neighbors: 5
  smote_sampling_strategy:
    1: 400000
    2: 200000
    3: 100000

logging:
  level: "INFO"
  log_path: "./data/logs/pipeline.log"