processing:
  force_recompute: false

seasons:
  active: ["summer"]                       # one season only — speed, not coverage

labels:
  density_method: "kde"
  classify_method: "jenks"
  n_classes: 4                             # match production scheme (see flag below)
  compare_classify_methods: []
  clean_labels: false
  auto_find_k: false

modeling:
  mlflow_experiment: "wf-baseline"        # was "wf-baseline" — now distinct from dissertation's experiment name so runs never intermix in MLflow
  cv_strategy: "both"                      # both sides, to exercise the full optimism-gap + Kruskal-Wallis code path
  log_full_cv_diagnostics: true            # pays for the primary side's full re-scoring pass — this run exists to prove that path doesn't crash, not to be fast
  cv_folds: 5                              # smallest sane fold count, same reason
  models: ["ordinal_lr", "random_forest"]  # fastest two — one parametric, one non-parametric, enough to exercise both code paths
  imbalance_strategy: "cost_weighted"
  optuna_n_trials: 10                       # just enough to confirm Optuna wiring, not to tune anything
  excluded_features: ["tas", "tasmin", "sfcWind", "d_fires"]
  optuna_search_subsample: 1.0