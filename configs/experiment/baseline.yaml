processing:
  force_recompute: false

seasons:
  active: ["summer"]

labels:
  density_method: "convolution"
  classify_method: "gmm"
  compare_classify_methods: ["jenks", "gmm"]
  auto_find_k: false
  include_d_fires_as_feature: false

modeling:
  mlflow_experiment: "wildfire-summer-gmm-baseline"
  cv_strategy: "both"                       # was stratified_spatial_block — needed for Kruskal-Wallis + standard-vs-stratified comparison
  log_full_cv_diagnostics: true             # this is the reported run — pays the extra CV pass for the full standard-vs-spatial gap + Kruskal-Wallis fold data
  models: ["catboost"]  # was ["xgboost"] — xgboost replaced by catboost in the finalized roster
  use_smote: true                           # was false — was silently disabling everything below
  smote_during_search: true
  search_resample_target_size: 100_000       # now actually takes effect (search-time only)
  smote_sampling_strategy:                  # final refit target — prevents "auto" from oversampling to 683k majority count
    1: 400000
    2: 200000
    3: 100000