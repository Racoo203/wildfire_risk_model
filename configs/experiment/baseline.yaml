processing:
  force_recompute: false

seasons:
  active: ["summer"]
labels:
  density_method: "convolution"
  classify_method: "gmm"
  n_classes: 3                             # see flag below — align with class_labels.py's 4-class "Very High" scheme
  compare_classify_methods: []
  clean_labels: false
  auto_find_k: false

modeling:
  mlflow_experiment: "wf-diss"
  cv_strategy: "both"                      # mandatory for RQ1 — you need both sides to report the optimism gap
  log_full_cv_diagnostics: true            # this IS the reported run, per the flag's own docstring
  cv_folds: 3                              # trimmed from schema default 5 — deliberate cost control, see note below
  models: ["ordinal_lr", "random_forest"]  # see flag below re: neural_net
  imbalance_strategy: "cost_weighted"
  optuna_n_trials: 40                      # bumped 20->40: random_forest's param_space (models/random_forest.py) was widened 08/17/2026 (max_depth 12->20, min_samples_leaf/min_samples_split floors lowered) to test whether the near-zero optimism gap under this label config holds under more capacity — a bigger search space needs more trials to explore meaningfully. cv_folds left at 3 (unchanged) per explicit request.
  excluded_features: ["tas", "tasmin", "d_fires"]
  optuna_search_subsample: 0.8