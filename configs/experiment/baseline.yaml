processing:
  force_recompute: false

seasons:
  active: ["spring"]                       # one season only — speed, not coverage

labels:
  density_method: "kde"
  classify_method: "jenks"
  n_classes: 5                             # match production scheme (see flag below)
  compare_classify_methods: []
  clean_labels: false
  auto_find_k: false

modeling:
  mlflow_experiment: "wf-baseline"        # was "wf-baseline" — now distinct from dissertation's experiment name so runs never intermix in MLflow
  cv_strategy: "both"                      # both sides, to exercise the full nested-CV + optimism-gap + Kruskal-Wallis code path
  log_full_cv_diagnostics: true            # pays for both sides' nested pass — this run exists to prove that path doesn't crash, not to be fast
  optuna_inner_cv_folds: 2                 # smallest sane inner loop — this run is about correctness, not tuning quality
  cv_folds: 2                              # smallest sane outer loop, same reason
  models: ["ordinal_lr", "random_forest"]  # fastest two — one parametric, one non-parametric, enough to exercise both code paths
  imbalance_strategy: "cost_weighted"
  optuna_n_trials: 3                       # just enough to confirm Optuna wiring, not to tune anything
  excluded_features: ["tas", "tasmin", "sfcWind", "d_fires"]