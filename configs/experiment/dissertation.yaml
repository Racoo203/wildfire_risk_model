processing:
  force_recompute: false

seasons:
  active: ["spring", "summer", "fall", "winter"]
labels:
  density_method: "convolution"
  classify_method: "gmm"
  n_classes: 3                             
  compare_classify_methods: []
  clean_labels: false
  auto_find_k: false

modeling:
  mlflow_experiment: "wf-diss"
  cv_strategy: "both"                      
  log_full_cv_diagnostics: true            
  cv_folds: 3
  models: ["ordinal_lr", "random_forest", "xgboost", "catboost"]
  imbalance_strategy: "cost_weighted"
  optuna_n_trials: 20
  excluded_features: ["tas", "tasmin", "d_fires"]