processing:
  force_recompute: false

seasons:
  # active: ["spring", "summer", "fall", "winter"]     # your three seasonal models — the headline stratification
  active: ["summer"]
labels:
  density_method: "kde"
  classify_method: "jenks"
  n_classes: 4                             # see flag below — align with class_labels.py's 4-class "Very High" scheme
  compare_classify_methods: []
  clean_labels: false
  auto_find_k: false

modeling:
  mlflow_experiment: "wf-diss"
  cv_strategy: "both"                      # mandatory for RQ1 — you need both sides to report the optimism gap
  log_full_cv_diagnostics: true            # this IS the reported run, per the flag's own docstring
  cv_folds: 5                              # trimmed from schema default 5 — deliberate cost control, see note below
  models: ["ordinal_lr", "random_forest", "catboost", "neural_net"]   # see flag below re: neural_net
  imbalance_strategy: "cost_weighted"
  optuna_n_trials: 50                      # trimmed from 30/50 — see runtime note below
  excluded_features: ["tas", "tasmin", "sfcWind", "d_fires"]