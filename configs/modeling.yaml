modeling:
  models: ["random_forest", "svm", "xgboost", "neural_net"]
  optuna_n_trials: 30
  cv_folds: 5
  mlflow_experiment: "wildfire-susceptibility-essex"
  selection_rule: "best_auc"      # options: "best_auc" | "most_conservative"
  cv_strategy: "both"             # options: "standard" | "spatial" | "stratified_spatial_block" | "both"
  spatial_block_size_m: 5000.0
  spatial_buffer_m: 0.0           # exclusion-zone width (m) around test blocks for spatial/stratified_spatial_block CV; 0.0 = no buffer (prior behavior)
  optuna_search_subsample: 50000
  use_smote: false
  smote_k_neighbors: 5
  optuna_search_subsample_by_model:
    svm: 6000
  excluded_features: ["tas", "tasmin"]